<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>스펀지맵</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #6C63FF;
      --primary-light: #a78bfa;
      --accent: #FF6584;
      --bg: #0b0b1e;
      --bg2: #13132b;
      --surface: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
      --text: #ffffff;
      --text2: rgba(255,255,255,0.55);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    /* ══════════════════════════════
       공통 화면 전환
    ══════════════════════════════ */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ══════════════════════════════
       SCREEN 1 — 인트로 (캐릭터만)
    ══════════════════════════════ */
    #screen-intro {
      background: var(--bg);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #screen-intro model-viewer {
      width: 100%;
      height: 100dvh;
      --progress-bar-color: transparent;
    }

    /* 터치 힌트 링 */
    /* 인트로 말풍선 */
    .intro-bubble {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a2e;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 24px;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      z-index: 10;
      animation: bubble-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both,
                 bubble-float 3s ease-in-out 0.5s infinite;
      letter-spacing: -0.3px;
    }

    /* 말풍선 꼬리 (아래) */
    .intro-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255,255,255,0.95);
      border-bottom: none;
    }

    @keyframes bubble-pop {
      from { opacity: 0; transform: translateX(-50%) scale(0.7); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes bubble-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(-5px); }
    }

    .pulse-ring {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      pointer-events: none;
    }

    .pulse-ring::before,
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(108, 99, 255, 0.7);
      animation: ring-pulse 2s ease-out infinite;
    }

    .pulse-ring::after {
      animation-delay: 0.7s;
      border-color: rgba(108, 99, 255, 0.4);
    }

    .pulse-ring-dot {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      animation: dot-breathe 2s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%   { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    @keyframes dot-breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.2); opacity: 1; }
    }

    /* ══════════════════════════════
       SCREEN 2 — 캐릭터 선택
    ══════════════════════════════ */
    #screen-select {
      background: var(--bg);
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 24px;
    }

    .select-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .select-title span {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .select-subtitle {
      font-size: 14px;
      color: var(--text2);
      text-align: center;
      margin-top: -16px;
    }

    .char-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .char-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 20px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .char-card:active { transform: scale(0.96); }

    .char-card.selected {
      border-color: var(--primary);
      background: rgba(108,99,255,0.12);
    }

    .char-card.random-card {
      grid-column: 1 / -1;
      flex-direction: row;
      padding: 16px 20px;
      gap: 14px;
    }

    .char-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: rgba(108,99,255,0.15);
      overflow: hidden;
      position: relative;
    }

    .char-preview model-viewer {
      width: 120px;
      height: 120px;
      position: absolute;
      top: -20px;
      left: -20px;
      --progress-bar-color: transparent;
    }

    .char-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .char-desc {
      font-size: 11px;
      color: var(--text2);
      text-align: center;
      line-height: 1.4;
    }

    .random-icon {
      font-size: 36px;
      flex-shrink: 0;
    }

    .random-text h3 { font-size: 15px; font-weight: 700; }
    .random-text p  { font-size: 12px; color: var(--text2); margin-top: 3px; }

    .btn-start {
      width: 100%;
      max-width: 340px;
      padding: 18px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(108,99,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: -0.3px;
    }

    .btn-start:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px rgba(108,99,255,0.25);
    }

    .btn-start:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ══════════════════════════════
       SCREEN 3 — 채팅
    ══════════════════════════════ */
    #screen-chat {
      background: var(--bg);
      flex-direction: column;
    }

    /* 캐릭터 패널 */
    .chat-char-panel {
      flex-shrink: 0;
      height: 38dvh;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse 100% 80% at 50% 50%, rgba(108,99,255,0.12) 0%, transparent 70%);
    }

    .chat-char-panel model-viewer {
      width: 100%;
      height: 100%;
      --progress-bar-color: transparent;
    }

    /* 캐릭터 이름 배지 */
    .char-name-badge {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(108,99,255,0.75);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* 말풍선 오버레이 */
    .char-bubble {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      color: #1a1a2e;
      border-radius: 16px 16px 16px 4px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      max-width: 80%;
      text-align: center;
      line-height: 1.4;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .char-bubble.visible { opacity: 1; }

    /* 채팅 영역 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { display: none; }

    /* 메시지 버블 */
    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 85%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg.user .msg-avatar {
      background: rgba(255,255,255,0.12);
    }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .msg.bot .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* 타이핑 인디케이터 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text2);
      animation: typing 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(-4px); opacity: 1; }
    }

    /* 입력창 */
    /* ── 예시 문구 칩 ── */
    .suggestion-chips {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg2);
      transition: opacity 0.3s ease, max-height 0.3s ease;
      max-height: 60px;
    }

    .suggestion-chips::-webkit-scrollbar { display: none; }

    .suggestion-chips.hidden {
      opacity: 0;
      max-height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(108,99,255,0.4);
      background: rgba(108,99,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .chip:active {
      background: rgba(108,99,255,0.25);
      border-color: var(--primary);
      transform: scale(0.96);
    }

    .chat-input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }

    .chat-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .chat-input::placeholder { color: var(--text2); }

    .chat-send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 4px 14px rgba(108,99,255,0.4);
    }

    .chat-send-btn:active { transform: scale(0.93); }
    .chat-send-btn:disabled { opacity: 0.4; }

    .chat-send-btn svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* API 키 미설정 배너 */
    .api-notice {
      margin: 8px 16px 0;
      padding: 10px 14px;
      background: rgba(255, 101, 132, 0.12);
      border: 1px solid rgba(255,101,132,0.3);
      border-radius: 12px;
      font-size: 12px;
      color: #FF6584;
      text-align: center;
      display: none;
    }

    /* 로딩 스피너 */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(108,99,255,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══ 로딩 ══ -->
<div id="loading-screen">
  <div class="loading-logo">스펀지맵</div>
  <div class="loading-spinner"></div>
</div>

<!-- ══ SCREEN 1: 인트로 ══ -->
<div id="screen-intro" class="screen hidden" onclick="goToSelect()">
  <model-viewer
    id="intro-viewer"
    src="base_basic_pbr_compressed.glb"
    alt="스펀지 캐릭터"
    autoplay
    shadow-intensity="1.5"
    shadow-softness="0.6"
    exposure="1.0"
    environment-image="neutral"
    camera-orbit="0deg 80deg 4.5m"
    camera-controls
    touch-action="none"
  ></model-viewer>

  <!-- 인트로 말풍선 (관리자에서 수정 가능) -->
  <div class="intro-bubble" id="intro-bubble">준비되셨나요, 터치해 주세요</div>

  <!-- 터치 힌트 -->
  <div class="pulse-ring">
    <div class="pulse-ring-dot"></div>
  </div>
</div>

<!-- ══ SCREEN 2: 캐릭터 선택 ══ -->
<div id="screen-select" class="screen hidden">
  <h2 class="select-title">지금 감정을<br><span>함께 느껴볼</span> 친구</h2>
  <p class="select-subtitle">Feel. Learn. Become. 🌱</p>

  <div class="char-grid">
    <!-- 캐릭터 A -->
    <div class="char-card" id="card-0" onclick="selectChar(0)">
      <div class="char-preview">🟣</div>
      <div class="char-name">스펀지 블루</div>
      <div class="char-desc">차분하게 감정을<br>들어주는 친구</div>
    </div>

    <!-- 캐릭터 B -->
    <div class="char-card" id="card-1" onclick="selectChar(1)">
      <div class="char-preview">🟡</div>
      <div class="char-name">스펀지 골드</div>
      <div class="char-desc">밝은 에너지로<br>회복을 도와줘요</div>
    </div>

    <!-- 랜덤 -->
    <div class="char-card random-card" onclick="selectRandom()">
      <div class="random-icon">🎲</div>
      <div class="random-text">
        <h3>감각에 맡겨볼게요</h3>
        <p>지금 이 순간의 감정이 고를 거예요</p>
      </div>
    </div>
  </div>

  <button class="btn-start" id="btn-start" onclick="startChat()" disabled>
    감정 여행 시작하기 →
  </button>
</div>

<!-- ══ SCREEN 3: 채팅 ══ -->
<div id="screen-chat" class="screen hidden">

  <!-- 캐릭터 패널 -->
  <div class="chat-char-panel">
    <model-viewer
      id="chat-viewer"
      src="base_basic_pbr_compressed.glb"
      alt="스펀지 캐릭터"
      autoplay
      shadow-intensity="1.2"
      shadow-softness="0.7"
      exposure="1.0"
      environment-image="neutral"
      camera-orbit="0deg 75deg 4m"
      camera-controls
      touch-action="pan-y"
    ></model-viewer>
    <div class="char-bubble" id="char-bubble"></div>
    <div class="char-name-badge" id="char-name-badge">스펀지 블루</div>
  </div>

  <!-- API 키 안내 -->
  <div class="api-notice" id="api-notice">
    ⚠️ OpenAI API 키를 설정해야 대화 기능이 활성화돼요. index.html의 API_KEY를 입력해 주세요.
  </div>

  <!-- 채팅 영역 -->
  <div class="chat-area">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="suggestion-chips hidden" id="suggestion-chips"></div>
    <div class="chat-input-bar">
      <textarea
        class="chat-input"
        id="chat-input"
        placeholder="지금 기분이 어떠세요? 솔직하게 말해줘도 돼요 🌿"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this); if(this.value) hideSuggestions();"
      ></textarea>
      <button class="chat-send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════
// 🔄 앞모습 위주 자동 회전 (시계방향 진동)
// ══════════════════════════════
function startFrontFocusedRotation(viewer, phiDeg, radiusM, amplitudeDeg, speedRad) {
  // amplitudeDeg: 앞에서 좌우로 흔들리는 각도 범위 (예: 65 → 앞±65°)
  // speedRad: 진동 속도 (라디안/초, 예: 0.45 → 약 14초 주기)
  const controller = new AbortController();
  const { signal } = controller;

  // 시계방향: phase = π 에서 시작 → sin(π)=0, 이후 감소 → 음수 theta = 왼쪽으로 → 캐릭터 오른쪽 먼저 노출 = 시계방향
  let phase = Math.PI;
  let lastTs = null;
  let paused = false;
  let resumeTimer = null;

  function loop(ts) {
    if (signal.aborted) return;
    requestAnimationFrame(loop);
    if (paused) { lastTs = null; return; }
    if (lastTs !== null) {
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      phase -= speedRad * dt; // phase 감소 → 시계방향
    }
    lastTs = ts;
    const theta = amplitudeDeg * Math.sin(phase);
    viewer.setAttribute('camera-orbit', `${theta.toFixed(2)}deg ${phiDeg}deg ${radiusM}m`);
  }

  // 유저가 터치/드래그 시작 → 자동 회전 일시정지
  viewer.addEventListener('camera-change', e => {
    if (e.detail?.source === 'user-interaction') {
      paused = true;
      clearTimeout(resumeTimer);
    }
  }, { signal });

  // 터치/포인터 끝나면 2초 후 재개 (현재 각도 기준으로 부드럽게 이어서)
  ['pointerup', 'touchend'].forEach(evt => {
    viewer.addEventListener(evt, () => {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        try {
          const orb = viewer.getCameraOrbit();
          if (orb) {
            // 현재 theta에 맞춰 phase 동기화 → 튀는 현상 방지
            const curTheta = orb.theta * (180 / Math.PI);
            const ratio = Math.max(-1, Math.min(1, curTheta / amplitudeDeg));
            // sin(phase) = ratio → phase = asin(ratio)
            // 현재 방향(감소 중)을 유지하기 위해 π - asin(ratio) 사용
            phase = Math.PI - Math.asin(ratio);
          }
        } catch (_) {}
        paused = false;
      }, 2000);
    }, { signal });
  });

  requestAnimationFrame(loop);
  return () => { controller.abort(); clearTimeout(resumeTimer); };
}

// ── 일일 사용량 체크 ──
function getTodayKey() {
  return 'sponge_count_' + new Date().toISOString().slice(0,10);
}
function getDailyCount() {
  return parseInt(localStorage.getItem(getTodayKey()) || '0');
}
function getDailyLimit() {
  return parseInt(localStorage.getItem('sponge_daily_limit') || '0'); // 0=무제한
}
function incrementDailyCount() {
  const key = getTodayKey();
  localStorage.setItem(key, getDailyCount() + 1);
}
function isLimitReached() {
  const limit = getDailyLimit();
  return limit > 0 && getDailyCount() >= limit;
}

// 상태 관리
// ══════════════════════════════
let selectedChar = null;
let chatHistory = [];
let isTyping = false;

// ══════════════════════════════
// 예시 문구 풀
// ══════════════════════════════
const SUGGESTION_POOL = [
  '요즘 자꾸 지쳐요',
  '아무것도 하기 싫어요',
  '혼자 있고 싶어요',
  '기분 전환이 필요해요',
  '스트레스가 너무 많아요',
  '누군가가 그리워요',
  '새로운 자극이 필요해요',
  '무기력한 기분이에요',
  '불안한 마음이 있어요',
  '복잡한 생각이 많아요',
  '쉬고 싶은데 쉬어지지 않아요',
  '외로운 것 같아요',

];

function showSuggestions() {
  const chips = document.getElementById('suggestion-chips');
  const shuffled = [...SUGGESTION_POOL].sort(() => Math.random() - 0.5);
  const picked = shuffled.slice(0, 3);

  chips.innerHTML = picked.map(text =>
    `<button class="chip" onclick="useChip('${text}')">${text}</button>`
  ).join('');
  chips.classList.remove('hidden');
}

function hideSuggestions() {
  document.getElementById('suggestion-chips').classList.add('hidden');
}

function useChip(text) {
  const input = document.getElementById('chat-input');
  input.value = text;
  autoResize(input);
  hideSuggestions();
  sendMessage();
}

// ══════════════════════════════
// 화면 전환
// ══════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  // 애니메이션 트리거
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'scale(1)'; });
}

// ══════════════════════════════
// SCREEN 1 → 2
// ══════════════════════════════
function goToSelect() {
  showScreen('screen-select');
}

// ══════════════════════════════
// 캐릭터 선택
// ══════════════════════════════
function selectChar(idx) {
  selectedChar = CHARACTERS[idx];
  document.querySelectorAll('.char-card').forEach((c, i) => {
    c.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-start').disabled = false;
}

function selectRandom() {
  const idx = Math.floor(Math.random() * CHARACTERS.length);
  selectChar(idx);
  // 랜덤 카드 강조
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  document.querySelector('.random-card').classList.add('selected');
}

// ══════════════════════════════
// SCREEN 2 → 3
// ══════════════════════════════
function startChat() {
  if (!selectedChar) return;

  // 채팅 뷰어 캐릭터 교체
  const chatViewer = document.getElementById('chat-viewer');
  if (_chatRotationStop) { _chatRotationStop(); _chatRotationStop = null; }
  chatViewer.setAttribute('src', selectedChar.glb);

  // 모델 로드 후 앞모습 위주 시계방향 자동 회전 시작 (amplitude 65°, auto-rotate-delay 3초)
  const _onChatLoad = () => {
    chatViewer.removeEventListener('load', _onChatLoad);
    setTimeout(() => {
      _chatRotationStop = startFrontFocusedRotation(chatViewer, 75, 4, 65, 0.35);
    }, 3000);
  };
  chatViewer.addEventListener('load', _onChatLoad);

  // 이름 배지
  document.getElementById('char-name-badge').textContent = selectedChar.name;

  // API 키 체크
  if (API_KEY === 'YOUR_OPENAI_API_KEY') {
    document.getElementById('api-notice').style.display = 'block';
  }

  // 채팅 기록 초기화
  chatHistory = [];
  document.getElementById('chat-messages').innerHTML = '';

  showScreen('screen-chat');

  // 첫 인사 메시지 (관리자 설정 우선)
  setTimeout(() => {
    let msg;
    if (window.customGreeting) {
      msg = window.customGreeting;
    } else {
      const greetings = [
        `안녕하세요, 저는 ${selectedChar.name}이에요 🌿\n지금 이 순간, 어떤 감정이 느껴지시나요?`,
        `반가워요 💙 ${selectedChar.name}이 왔어요.\n오늘 마음 상태가 어떠세요? 솔직하게 말해줘도 돼요.`,
        `Feel. Learn. Become. 🌱\n${selectedChar.name}과 함께 지금 감정을 천천히 들여다봐요.\n어떤 기분으로 오셨나요?`
      ];
      msg = greetings[Math.floor(Math.random() * greetings.length)];
    }
    addBotMessage(msg);
    showBubble(msg.split('\n')[0]);
  }, 600);
}

// ══════════════════════════════
// 채팅 기능
// ══════════════════════════════
function addBotMessage(text) {
  const messages = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="msg-avatar">${selectedChar?.emoji || '🟣'}</div>
    <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  // 봇 메시지 후 예시 문구 표시
  setTimeout(showSuggestions, 300);
}

function addUserMessage(text) {
  const messages = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-avatar">👤</div>
    <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function showTyping() {
  const messages = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-msg';
  div.innerHTML = `
    <div class="msg-avatar">${selectedChar?.emoji || '🟣'}</div>
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

function showBubble(text) {
  const bubble = document.getElementById('char-bubble');
  bubble.textContent = text;
  bubble.classList.add('visible');
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => bubble.classList.remove('visible'), 4000);
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = '';
  input.style.height = 'auto';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;

  addUserMessage(text);
  chatHistory.push({ role: 'user', content: text });

  showTyping();

  // ── 일일 사용량 제한 체크 ──
  if (isLimitReached()) {
    removeTyping();
    const limitMsg = `오늘은 대화를 많이 나눴어요 🌿\n내일 또 함께 이야기해요! (일일 한도 도달)`;
    addBotMessage(limitMsg);
    isTyping = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  try {
    let reply;
    // API 키 최신값 읽기
    const currentApiKey = localStorage.getItem('sponge_api_key') || 'YOUR_OPENAI_API_KEY';

    if (currentApiKey === 'YOUR_OPENAI_API_KEY') {
      // ── 데모 모드 (API 키 없을 때) ──
      await new Promise(r => setTimeout(r, 1200));
      const demos = [
        '그 감정, 충분히 느껴도 괜찮아요 🌿 지금 이 감각이 어디서 오는지 함께 들여다볼게요.',
        '안정이 필요할 때는 고요한 자연 공간이 가장 좋아요 🍃 감정이 흡수될 수 있는 장소를 찾아드릴게요.',
        '그 기분, 활력추구형에 가깝게 느껴져요 ✨ 새로운 자극과 공간이 에너지를 회복시켜 줄 거예요.',
        '자기성찰이 필요한 순간이군요 💙 혼자 걷기 좋은 숲길이나 조용한 공간을 연결해 드릴게요.',
        '관계에서 오는 피로감이죠 🌱 사람 밀도가 낮고 자연친화도가 높은 공간이 회복에 도움돼요.'
      ];
      reply = demos[Math.floor(Math.random() * demos.length)];
    } else {
      // ── GPT API 호출 ──
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentApiKey}`
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [
            { role: 'system', content: selectedChar.systemPrompt },
            ...chatHistory
          ],
          max_tokens: 200,
          temperature: 0.8
        })
      });

      if (!response.ok) throw new Error(`API Error: ${response.status}`);
      const data = await response.json();
      reply = data.choices[0].message.content;
      chatHistory.push({ role: 'assistant', content: reply });
    }

    removeTyping();
    addBotMessage(reply);
    showBubble(reply.length > 40 ? reply.slice(0, 38) + '…' : reply);
    incrementDailyCount(); // 사용량 카운트 증가

  } catch (err) {
    removeTyping();
    const errMsg = 'API 연결에 문제가 생겼어요 😅\nAPI 키를 확인해 주세요.';
    addBotMessage(errMsg);
    console.error(err);
  }

  isTyping = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('chat-input').focus();
}

// ══════════════════════════════
// 입력창 핸들러
// ══════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// 키보드 올라올 때 스크롤 처리
window.visualViewport?.addEventListener('resize', () => {
  const messages = document.getElementById('chat-messages');
  if (messages) messages.scrollTop = messages.scrollHeight;
});

    startFrontFocusedRotation(introViewer, 80, 4.5, 65, 0.45);

  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hide');
    showScreen('screen-intro');
  }, 4000);
});
</script>
