<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>스펀지맵</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #6C63FF;
      --primary-light: #a78bfa;
      --accent: #FF6584;
      --bg: #0b0b1e;
      --bg2: #13132b;
      --surface: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
      --text: #ffffff;
      --text2: rgba(255,255,255,0.55);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    /* ══════════════════════════════
       공통 화면 전환
    ══════════════════════════════ */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ══════════════════════════════
       SCREEN 1 — 인트로 (캐릭터만)
    ══════════════════════════════ */
    #screen-intro {
      background: var(--bg);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #screen-intro model-viewer {
      width: 100%;
      height: 100dvh;
      --progress-bar-color: transparent;
    }

    /* 터치 힌트 링 */
    /* 인트로 말풍선 */
    .intro-bubble {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a2e;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 24px;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      z-index: 10;
      animation: bubble-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both,
                 bubble-float 3s ease-in-out 0.5s infinite;
      letter-spacing: -0.3px;
    }

    /* 말풍선 꼬리 (아래) */
    .intro-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255,255,255,0.95);
      border-bottom: none;
    }

    @keyframes bubble-pop {
      from { opacity: 0; transform: translateX(-50%) scale(0.7); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes bubble-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(-5px); }
    }

    .pulse-ring {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      pointer-events: none;
    }

    .pulse-ring::before,
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(108, 99, 255, 0.7);
      animation: ring-pulse 2s ease-out infinite;
    }

    .pulse-ring::after {
      animation-delay: 0.7s;
      border-color: rgba(108, 99, 255, 0.4);
    }

    .pulse-ring-dot {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      animation: dot-breathe 2s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%   { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    @keyframes dot-breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.2); opacity: 1; }
    }

    /* ══════════════════════════════
       SCREEN 2 — 캐릭터 선택
    ══════════════════════════════ */
    #screen-select {
      background: var(--bg);
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 24px;
    }

    .select-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .select-title span {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .select-subtitle {
      font-size: 14px;
      color: var(--text2);
      text-align: center;
      margin-top: -16px;
    }

    .char-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .char-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 20px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .char-card:active { transform: scale(0.96); }

    .char-card.selected {
      border-color: var(--primary);
      background: rgba(108,99,255,0.12);
    }

    .char-card.random-card {
      grid-column: 1 / -1;
      flex-direction: row;
      padding: 16px 20px;
      gap: 14px;
    }

    .char-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: rgba(108,99,255,0.15);
      overflow: hidden;
      position: relative;
    }

    /* 스펀지캐.png 없을 때 폴백 이모지 */
    .char-preview .char-emoji-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      z-index: 1;
    }

    /* 선택된 카드 — 더 명확한 표시 */
    .char-card.selected {
      border-color: var(--primary) !important;
      background: rgba(108,99,255,0.18) !important;
      box-shadow: 0 0 0 2px var(--primary), 0 8px 24px rgba(108,99,255,0.3);
    }

    .char-card.selected::after {
      content: '✓';
      position: absolute;
      top: 8px; right: 10px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 22px;
      text-align: center;
    }

    .char-preview model-viewer {
      width: 120px;
      height: 120px;
      position: absolute;
      top: -20px;
      left: -20px;
      --progress-bar-color: transparent;
    }

    .char-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .char-desc {
      font-size: 11px;
      color: var(--text2);
      text-align: center;
      line-height: 1.4;
    }

    .random-icon {
      font-size: 36px;
      flex-shrink: 0;
    }

    .random-text h3 { font-size: 15px; font-weight: 700; }
    .random-text p  { font-size: 12px; color: var(--text2); margin-top: 3px; }

    .btn-start {
      width: 100%;
      max-width: 340px;
      padding: 18px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(108,99,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: -0.3px;
    }

    .btn-start:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px rgba(108,99,255,0.25);
    }

    .btn-start:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ══════════════════════════════
       스펀지캐 스프라이트 (4열×5행)
    ══════════════════════════════ */
    .char-sprite {
      background-image: url('spongech.png');
      background-size: 400% 500%;
      background-repeat: no-repeat;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background-position 0.55s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      z-index: 2; /* 이모지 폴백 위에 표시 */
    }
    .char-sprite-sm { width: 34px; height: 34px; border-radius: 50%; }
    .char-sprite-md { width: 80px; height: 80px; }
    .char-sprite-xl {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(108,99,255,0.35);
      animation: char-breathe 3.2s ease-in-out infinite;
    }

    @keyframes char-breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50%       { transform: scale(1.04) translateY(-5px); }
    }

    /* ══════════════════════════════
       SCREEN 3 — 채팅
    ══════════════════════════════ */
    #screen-chat {
      background: var(--bg);
      flex-direction: column;
    }

    /* 2D 캐릭터 패널 */
    .chat-char-panel {
      flex-shrink: 0;
      height: 220px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 100% 80% at 50% 60%, rgba(108,99,255,0.18) 0%, transparent 70%);
      overflow: hidden;
      gap: 8px;
    }

    .chat-emotion-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-light);
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.4s, transform 0.4s;
    }
    .chat-emotion-label.visible { opacity: 1; transform: translateY(0); }

    /* 캐릭터 이름 배지 */
    .char-name-badge {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(108,99,255,0.75);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* 말풍선 오버레이 */
    .char-bubble {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      color: #1a1a2e;
      border-radius: 16px 16px 16px 4px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      max-width: 80%;
      text-align: center;
      line-height: 1.4;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .char-bubble.visible { opacity: 1; }

    /* 채팅 영역 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { display: none; }

    /* 메시지 버블 */
    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 85%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg.user .msg-avatar {
      background: rgba(255,255,255,0.12);
    }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .msg.bot .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* 타이핑 인디케이터 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text2);
      animation: typing 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(-4px); opacity: 1; }
    }

    /* 입력창 */
    /* ── 예시 문구 칩 ── */
    .suggestion-chips {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg2);
      transition: opacity 0.3s ease, max-height 0.3s ease;
      max-height: 60px;
    }

    .suggestion-chips::-webkit-scrollbar { display: none; }

    .suggestion-chips.hidden {
      opacity: 0;
      max-height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    /* ── 4개 시작 카드 ── */
    .starter-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 16px 8px;
      animation: fadeUp 0.5s ease both;
    }
    .starter-cards.hidden { display: none; }
    .starter-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 13px 14px;
      background: rgba(108,99,255,0.08);
      border: 1.5px solid rgba(108,99,255,0.28);
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, transform 0.15s;
    }
    .starter-card:hover { background: rgba(108,99,255,0.18); transform: translateY(-2px); }
    .starter-card .sc-emoji { font-size: 18px; line-height: 1; }
    .starter-card .sc-text  { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }

    /* ── 단계 진행 바 ── */
    .stage-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .stage-bar.hidden { display: none; }
    .stage-dots {
      display: flex;
      gap: 5px;
      flex: 1;
    }
    .stage-dot {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.12);
      transition: background 0.4s;
    }
    .stage-dot.done  { background: var(--primary); }
    .stage-dot.active{ background: var(--primary-light); }
    .stage-label {
      font-size: 10px;
      color: var(--text2);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* ── 여행카드 ── */
    .travel-card {
      margin: 10px 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(108,99,255,0.4);
      background: linear-gradient(145deg, rgba(108,99,255,0.15) 0%, rgba(13,13,43,0.9) 100%);
      animation: fadeUp 0.55s ease both;
    }
    .travel-card-header {
      padding: 12px 16px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-light);
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(108,99,255,0.2);
    }
    .travel-card-body { padding: 14px 16px 16px; }
    .travel-card-emoji { font-size: 36px; margin-bottom: 8px; }
    .travel-card-name  { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .travel-card-cat   { font-size: 11px; color: var(--primary-light); margin-bottom: 10px; }
    .travel-card-tags  { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .travel-card-tag   {
      font-size: 11px; padding: 3px 9px;
      border-radius: 20px;
      background: rgba(108,99,255,0.2);
      border: 1px solid rgba(108,99,255,0.35);
      color: var(--primary-light);
    }
    .travel-card-desc  { font-size: 13px; line-height: 1.65; color: var(--text); margin-bottom: 10px; }
    .travel-card-addr  { font-size: 11px; color: var(--text2); margin-bottom: 12px; }
    .travel-card-btn   {
      display: inline-block;
      padding: 10px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
      text-align: center;
    }
    .travel-card-btn:hover { opacity: 0.85; }

    .chip {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(108,99,255,0.4);
      background: rgba(108,99,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .chip:active {
      background: rgba(108,99,255,0.25);
      border-color: var(--primary);
      transform: scale(0.96);
    }

    .chat-input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }

    .chat-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .chat-input::placeholder { color: var(--text2); }

    .chat-send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 4px 14px rgba(108,99,255,0.4);
    }

    .chat-send-btn:active { transform: scale(0.93); }
    .chat-send-btn:disabled { opacity: 0.4; }

    .chat-send-btn svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* API 키 미설정 배너 */
    .api-notice {
      margin: 8px 16px 0;
      padding: 10px 14px;
      background: rgba(255, 101, 132, 0.12);
      border: 1px solid rgba(255,101,132,0.3);
      border-radius: 12px;
      font-size: 12px;
      color: #FF6584;
      text-align: center;
      display: none;
    }

    /* 로딩 스피너 */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(108,99,255,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══ 로딩 ══ -->
<div id="loading-screen">
  <div class="loading-logo">스펀지맵</div>

// 🔄 앞모습 위주 자동 회전 (시계방향 진동)
// ══════════════════════════════
function startFrontFocusedRotation(viewer, phiDeg, radiusM, amplitudeDeg, speedRad) {
  // amplitudeDeg: 앞에서 좌우로 흔들리는 각도 범위 (예: 65 → 앞±65°)
  // speedRad: 진동 속도 (라디안/초, 예: 0.45 → 약 14초 주기)
  const controller = new AbortController();
  const { signal } = controller;

  // 시계방향: phase = π 에서 시작 → sin(π)=0, 이후 감소 → 음수 theta = 왼쪽으로 → 캐릭터 오른쪽 먼저 노출 = 시계방향
  let phase = Math.PI;
  let lastTs = null;
  let paused = false;
  let resumeTimer = null;

  function loop(ts) {
    if (signal.aborted) return;
    requestAnimationFrame(loop);
    if (paused) { lastTs = null; return; }
    if (lastTs !== null) {
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      phase -= speedRad * dt; // phase 감소 → 시계방향
    }
    lastTs = ts;
    const theta = amplitudeDeg * Math.sin(phase);
    viewer.setAttribute('camera-orbit', `${theta.toFixed(2)}deg ${phiDeg}deg ${radiusM}m`);
  }

  // 유저가 터치/드래그 시작 → 자동 회전 일시정지
  viewer.addEventListener('camera-change', e => {
    if (e.detail?.source === 'user-interaction') {
      paused = true;
      clearTimeout(resumeTimer);
    }
  }, { signal });

  // 터치/포인터 끝나면 2초 후 재개 (현재 각도 기준으로 부드럽게 이어서)
  ['pointerup', 'touchend'].forEach(evt => {
    viewer.addEventListener(evt, () => {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        try {
          const orb = viewer.getCameraOrbit();
          if (orb) {
            // 현재 theta에 맞춰 phase 동기화 → 튀는 현상 방지
            const curTheta = orb.theta * (180 / Math.PI);
            const ratio = Math.max(-1, Math.min(1, curTheta / amplitudeDeg));
            // sin(phase) = ratio → phase = asin(ratio)
            // 현재 방향(감소 중)을 유지하기 위해 π - asin(ratio) 사용
            phase = Math.PI - Math.asin(ratio);
          }
        } catch (_) {}
        paused = false;
      }, 2000);
    }, { signal });
  });

  requestAnimationFrame(loop);
  return () => { controller.abort(); clearTimeout(resumeTimer); };
}

function checkRisk(text) {
  const t = text.replace(/\s/g,'');
  return RISK_KEYWORDS.some(kw => t.includes(kw));
}

let _currentEmotionChar = null; // 현재 표시 중인 스프라이트 캐릭터

function detectEmotionChar(text) {
  const lower = text.toLowerCase();
  let best = null, maxScore = 0;
  for (const ch of EMOTION_CHAR_MAP) {
    let score = 0;
    for (const kw of ch.keywords) if (lower.includes(kw)) score++;
    if (score > maxScore) { maxScore = score; best = ch; }
  }
  return maxScore > 0 ? best : null;
}

function updateChatSprite(charObj) {
  if (!charObj) return;
  _currentEmotionChar = charObj;
  const sprite = document.getElementById('chat-sprite');
  const label  = document.getElementById('chat-emotion-label');
  if (sprite) sprite.style.backgroundPosition = `${charObj.x}% ${charObj.y}%`;
  if (label) {
    label.textContent = charObj.label || charObj.emotion;
    label.classList.add('visible');
    clearTimeout(label._t);
    label._t = setTimeout(() => label.classList.remove('visible'), 3500);
  }
  const nameBadge = document.getElementById('char-name-badge');
  if (nameBadge) nameBadge.textContent = `${charObj.name} · ${selectedChar?.name || ''}`;
}

function getTodayKey() {
  return 'sponge_count_' + new Date().toISOString().slice(0,10);
}
function getDailyCount() {
  return parseInt(localStorage.getItem(getTodayKey()) || '0');
}
function getDailyLimit() {
  return parseInt(localStorage.getItem('sponge_daily_limit') || '0'); // 0=무제한
}
function incrementDailyCount() {
  const key = getTodayKey();
  localStorage.setItem(key, getDailyCount() + 1);
}
function isLimitReached() {
  const limit = getDailyLimit();
  return limit > 0 && getDailyCount() >= limit;
}

function getStageConfig() {
  try {
    const saved = localStorage.getItem('sponge_stages');
    if (saved) {
      const arr = JSON.parse(saved);
      if (Array.isArray(arr) && arr.length >= 2) return arr;
    }
  } catch(e) {}
  return DEFAULT_STAGES;
}

function updateStageBar() {
  const stages = getStageConfig();
  const bar   = document.getElementById('stage-bar');
  const dots  = document.getElementById('stage-dots');
  const label = document.getElementById('stage-label');
  if (!bar) return;

  if (currentStage === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');

  dots.innerHTML = stages.map((s, i) => {
    const cls = i < currentStage - 1 ? 'done' : i === currentStage - 1 ? 'active' : '';
    return `<div class="stage-dot ${cls}" title="${s.name}"></div>`;
  }).join('');

  const stg = stages[currentStage - 1];
  if (label && stg) label.textContent = `${currentStage}단계 · ${stg.name}`;
}

function advanceStage() {
  const stages = getStageConfig();
  if (currentStage < stages.length) {
    currentStage++;
    updateStageBar();
  }
  // 마지막 단계에서 여행카드 준비 플래그
  if (currentStage >= stages.length) {
    setTimeout(triggerTravelCard, 800);
  }
}

// 단계별 시스템 프롬프트 주입
function getStagePromptAddition() {
  const stages = getStageConfig();
  const stg = stages[currentStage - 1];
  if (!stg) return '';
  return `\n\n[현재 대화 단계: ${currentStage}/${stages.length} — ${stg.name}]\n${stg.prompt}\n짧고 자연스럽게 1-2문장으로 응답하세요.`;
}

function showStarterCards() {
  const wrap = document.getElementById('starter-cards');

  wrap.innerHTML = STARTER_CARDS.map(c =>

     </button>`
  ).join('');

}

function hideStarterCards() {

  if (wrap) wrap.classList.add('hidden');
}

function useStarterCard(text, type) {
  stageContext.entryType = type;
  currentStage = 1;
  updateStageBar();

// ── 여행카드 생성 ──
function triggerTravelCard() {
  const places = getPlacesFromAdmin();
  if (!places || places.length === 0) return;

  // 감정 키워드와 수집된 stageContext로 최적 장소 선택
  const best = selectBestPlace(places);
  if (!best) return;
  renderTravelCard(best);
}

function getPlacesFromAdmin() {
  try {
    const raw = localStorage.getItem('sponge_places');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}

function selectBestPlace(places) {
  if (!places.length) return null;
  // 현재 감정 캐릭터 키워드와 장소 감정태그 매칭
  const emotionKeywords = _currentEmotionChar
    ? [...(_currentEmotionChar.keywords || []), _currentEmotionChar.emotion]
    : [];
  const entryType = stageContext.entryType || '';

  let best = null, maxScore = -1;
  places.forEach(p => {
    let score = 0;
    const tags = (p.tags || '').toLowerCase();
    emotionKeywords.forEach(kw => { if (tags.includes(kw)) score += 2; });
    if (entryType === 'color' && tags.includes('감성')) score++;
    if (entryType === 'location' && p.address) score++;
    if (entryType === 'place' && (tags.includes('숙박') || tags.includes('펜션'))) score += 2;
    if (score > maxScore) { maxScore = score; best = p; }
  });
  return best || places[Math.floor(Math.random() * places.length)];
}

function renderTravelCard(place) {
  const messages = document.getElementById('chat-messages');

  // 봇 아바타 + 안내 메시지
  const introDiv = document.createElement('div');
  introDiv.className = 'msg bot';
  introDiv.innerHTML = `
    <div class="msg-avatar" style="background:none;overflow:visible;">${getBotAvatarHTML()}</div>
    <div class="msg-bubble">감정 여행의 끝에서, 딱 맞는 장소를 찾았어요 🌿✨</div>
  `;
  messages.appendChild(introDiv);

  // 여행 카드
  const tags = (place.tags || '').split(',').map(t => t.trim()).filter(Boolean);
  const tagHTML = tags.map(t => `<span class="travel-card-tag">${t}</span>`).join('');
  const mapURL = (place.lat && place.lng)
    ? `https://map.naver.com/v5/search/${encodeURIComponent(place.name)}`
    : `https://map.naver.com/v5/search/${encodeURIComponent((place.address || place.name))}`;

  const cardDiv = document.createElement('div');
  cardDiv.className = 'msg bot';
  cardDiv.innerHTML = `
    <div class="msg-avatar" style="background:none;overflow:visible;">${getBotAvatarHTML()}</div>
    <div class="msg-bubble" style="padding:0; background:none; max-width:100%;">
      <div class="travel-card">
        <div class="travel-card-header">✈️ 당신을 위한 여행지 · 안성</div>
        <div class="travel-card-body">
          <div class="travel-card-emoji">${place.emoji || '🏞️'}</div>
          <div class="travel-card-name">${place.name}</div>
          <div class="travel-card-cat">${place.category || '힐링포인트'}</div>
          <div class="travel-card-tags">${tagHTML}</div>
          <div class="travel-card-desc">${place.desc || place.description || ''}</div>
          <div class="travel-card-addr">📍 ${place.address || '안성시'}</div>
          <button class="travel-card-btn" onclick="window.open('${mapURL}','_blank')">지도에서 보기 →</button>
        </div>
      </div>
    </div>
  `;
  messages.appendChild(cardDiv);
  messages.scrollTop = messages.scrollHeight;
  showBubble('여행지를 찾았어요 🌿');
}

function startChat() {
  // 선택 안 됐으면 첫 번째 캐릭터 자동 선택
  if (!selectedChar) selectChar(0);

  // 스프라이트 초기화 — 선택 캐릭터의 기본 스프라이트로 세팅
  _currentEmotionChar = selectedChar.defaultSprite;
  const sprite = document.getElementById('chat-sprite');
  if (sprite && _currentEmotionChar) {
    sprite.style.backgroundPosition = `${_currentEmotionChar.x}% ${_currentEmotionChar.y}%`;
  }

  // 이름 배지
  document.getElementById('char-name-badge').textContent = selectedChar.name;

  // API 키 체크
  if (API_KEY === 'YOUR_OPENAI_API_KEY') {
    document.getElementById('api-notice').style.display = 'block';
  }

  // 단계 초기화
  currentStage = 0;
  stageContext = {};
  updateStageBar();

  // 채팅 기록 초기화
  chatHistory = [];
  document.getElementById('chat-messages').innerHTML = '';
  hideStarterCards();

  showScreen('screen-chat');

  // 첫 인사 메시지 — 우선순위: 관리자설정 > 장소컨텍스트 > 검색어 > 기본
  setTimeout(() => {
    let msg;
    if (window.customGreeting) {
      msg = window.customGreeting;

    } else if (window._contextPlace) {
      // 랜딩페이지에서 장소를 선택하고 들어온 경우
      const p = window._contextPlace;
      const catEmoji = { heal:'🌿', color:'🎨', taste:'🍽️', exp:'🎭' }[p.cat] || '📍';
      const isBlue = selectedChar?.id !== 1;
      const pool = isBlue ? [
        `안녕하세요 🌿 스펀지맵에서 '${p.name}'에 마음이 머무셨군요.\n${catEmoji} ${p.catLabel || p.cat} 장소인데, 지금 어떤 감정으로 그 곳이 끌리셨나요?`,
        `'${p.name}'을 선택하셨네요 💙\n그 공간이 지금 당신에게 필요한 이유가 있을 것 같아요. 조금 더 이야기해줄 수 있어요?`
      ] : [
        `안녕하세요! ✨ 스펀지맵에서 '${p.name}'을 보셨군요!\n${catEmoji} 정말 매력적인 곳이에요 😊 지금 어떤 기분으로 오셨나요?`,
        `'${p.name}' 선택하셨네요 🌻\n그 장소가 끌린 감정, 같이 들여다봐요! 어떤 기분이에요?`
      ];
      msg = pool[Math.floor(Math.random() * pool.length)];
      // 사용 후 초기화 (한 번만 쓰기)
      window._contextPlace = null;

    } else if (window._searchQuery) {
      // 랜딩 검색어로 들어온 경우
      const q = window._searchQuery;
      const isBlue = selectedChar?.id !== 1;
      msg = isBlue
        ? `'${q}'을 찾고 계시는군요 🌿\n그 감성, 조금 더 말해줄 수 있어요? 딱 맞는 힐링포인트를 함께 찾아볼게요.`
        : `'${q}' 느낌을 원하시는군요 ✨\n어떤 감정이 그 키워드를 떠올리게 했을까요? 같이 이야기해봐요 😊`;
      window._searchQuery = null;

    } else {
      const greetings = [
        `안녕하세요, 저는 ${selectedChar.name}이에요 🌿\n지금 이 순간, 어떤 감정이 느껴지시나요?`,
        `반가워요 💙 ${selectedChar.name}이 왔어요.\n오늘 마음 상태가 어떠세요? 솔직하게 말해줘도 돼요.`,
        `Feel. Learn. Become. 🌱\n${selectedChar.name}과 함께 지금 감정을 천천히 들여다봐요.\n어떤 기분으로 오셨나요?`
      ];
      msg = greetings[Math.floor(Math.random() * greetings.length)];
    }
    addBotMessage(msg);
    showBubble(msg.split('\n')[0]);
  }, 600);
}

    <div class="msg-avatar" style="background:none;overflow:visible;">${getBotAvatarHTML()}</div>

function removeTyping() {

function showBubble(text) {
  const bubble = document.getElementById('char-bubble');
  bubble.textContent = text;
  bubble.classList.add('visible');
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => bubble.classList.remove('visible'), 4000);
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = '';
  input.style.height = 'auto';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;

  addUserMessage(text);
  chatHistory.push({ role: 'user', content: text });

  // ── 단계 진행 ──
  hideStarterCards();
  if (currentStage === 0) { currentStage = 1; updateStageBar(); }

  // ── 위험어 감지 (특허 CAUTION 플래그) ──
  if (checkRisk(text)) {
    removeTyping();
    const riskMsg = `잠깐, 제가 지금 조금 걱정이 돼요 🌿\n혼자 감당하기 힘든 감정이 있다면, 주변의 신뢰하는 분이나 전문 상담가와 꼭 이야기해 보세요.\n자살예방상담전화: ☎ 1393 (24시간)\n정신건강위기상담전화: ☎ 1577-0199\n당신은 소중한 사람이에요 💙`;
    addBotMessage(riskMsg);
    isTyping = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // ── 감정 감지 → 캐릭터 스프라이트 업데이트 ──
  const detected = detectEmotionChar(text);
  if (detected) updateChatSprite(detected);

  showTyping();

  // ── 일일 사용량 제한 체크 ──
  if (isLimitReached()) {
    removeTyping();
    const limitMsg = `오늘은 대화를 많이 나눴어요 🌿\n내일 또 함께 이야기해요! (일일 한도 도달)`;
    addBotMessage(limitMsg);
    isTyping = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  try {
    let reply;
    // API 키 최신값 읽기
    const currentApiKey = localStorage.getItem('sponge_api_key') || 'YOUR_OPENAI_API_KEY';

    if (currentApiKey === 'YOUR_OPENAI_API_KEY') {
      // ── 데모 모드 (API 키 없을 때) ──
      await new Promise(r => setTimeout(r, 1200));
      const demos = [
        '그 감정, 충분히 느껴도 괜찮아요 🌿 지금 이 감각이 어디서 오는지 함께 들여다볼게요.',
        '안정이 필요할 때는 고요한 자연 공간이 가장 좋아요 🍃 감정이 흡수될 수 있는 장소를 찾아드릴게요.',
        '그 기분, 활력추구형에 가깝게 느껴져요 ✨ 새로운 자극과 공간이 에너지를 회복시켜 줄 거예요.',
        '자기성찰이 필요한 순간이군요 💙 혼자 걷기 좋은 숲길이나 조용한 공간을 연결해 드릴게요.',
        '관계에서 오는 피로감이죠 🌱 사람 밀도가 낮고 자연친화도가 높은 공간이 회복에 도움돼요.'
      ];
      reply = demos[Math.floor(Math.random() * demos.length)];
    } else {
      // ── GPT API 호출 ──
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentApiKey}`
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [
            { role: 'system', content: getFullSystemPrompt() + getStagePromptAddition() },
            ...chatHistory
          ],
          max_tokens: 200,
          temperature: 0.8
        })
      });

      if (!response.ok) throw new Error(`API Error: ${response.status}`);
      const data = await response.json();
      reply = data.choices[0].message.content;
      chatHistory.push({ role: 'assistant', content: reply });
    }

    removeTyping();
    addBotMessage(reply);
    showBubble(reply.length > 40 ? reply.slice(0, 38) + '…' : reply);
    incrementDailyCount(); // 사용량 카운트 증가
    // 단계 진행 (응답 받을 때마다 다음 단계로)
    advanceStage();

  } catch (err) {
    removeTyping();
    const errMsg = 'API 연결에 문제가 생겼어요 😅\nAPI 키를 확인해 주세요.';
    addBotMessage(errMsg);
    console.error(err);
  }

  isTyping = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('chat-input').focus();
}

// ══════════════════════════════
// 입력창 핸들러
// ══════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// 키보드 올라올 때 스크롤 처리
window.visualViewport?.addEventListener('resize', () => {
  const messages = document.getElementById('chat-messages');
  if (messages) messages.scrollTop = messages.scrollHeight;
});

// ══════════════════════════════
// 장소 DB 포함 풀 시스템 프롬프트
// ══════════════════════════════
function getFullSystemPrompt() {
  let prompt = selectedChar.systemPrompt;
  try {
    const placePrompt = localStorage.getItem('sponge_place_prompt');
    if (placePrompt) prompt += placePrompt;
  } catch(e) {}
  return prompt;
}

// ══════════════════════════════
// 초기 로딩
// ══════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  // 관리자 설정값 반영
  const savedIntro = localStorage.getItem('sponge_intro_text');
  if (savedIntro) {
    document.getElementById('intro-bubble').textContent = savedIntro;
  }

  const savedGreeting = localStorage.getItem('sponge_greeting_text');
  if (savedGreeting) {
    window.customGreeting = savedGreeting;
  }

  // ── 랜딩페이지 컨텍스트 읽기 ──
  try {
    // localStorage 경로: 스펀지맵 랜딩 아티팩트에서 저장된 장소 (30분 유효)
    const ctxRaw  = localStorage.getItem('sponge_context_place');
    const ctxTime = parseInt(localStorage.getItem('sponge_context_time') || '0');
    if (ctxRaw && (Date.now() - ctxTime) < 30 * 60 * 1000) {
      window._contextPlace = JSON.parse(ctxRaw);
      localStorage.removeItem('sponge_context_place');
      localStorage.removeItem('sponge_context_time');
    }
    const sq = localStorage.getItem('sponge_search_query');
    if (sq) {
      window._searchQuery = sq;
      localStorage.removeItem('sponge_search_query');
    }
  } catch(e) {}

  // URL 파라미터 경로: index.html?place=이름&cat=heal&desc=...&lat=...&lng=...
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('place')) {
      window._contextPlace = {
        name:     params.get('place'),
        cat:      params.get('cat')      || '',
        catLabel: params.get('catLabel') || '',
        desc:     params.get('desc')     || '',
        lat:      parseFloat(params.get('lat') || '0'),
        lng:      parseFloat(params.get('lng') || '0'),
        tags:     params.get('tags')     || ''
      };
    }
    if (params.get('q')) window._searchQuery = params.get('q');
  } catch(e) {}

  const introViewer = document.getElementById('intro-viewer');

  introViewer.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loading-screen').classList.add('hide');
      showScreen('screen-intro');
    }, 500);
    // 인트로: 앞모습 위주 시계방향 자동 회전 (amplitude 65°, 약 14초 주기)
    startFrontFocusedRotation(introViewer, 80, 4.5, 65, 0.45);
  });

  // 폴백: 4초 후 강제 진입
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hide');
    showScreen('screen-intro');
  }, 4000);
});
</script>
